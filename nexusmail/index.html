<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexusMail</title>
<style>
  :root {
    --bg:#04060d; --panel:#0a1020; --panel2:#0d1630; --line:#16315e;
    --neon:#00e5ff; --neon2:#2f7bff; --text:#d8f6ff; --muted:#6f8fb8; --danger:#ff4d8d; --ok:#3dffb0;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh;
         background:
           radial-gradient(900px 500px at 15% -10%, rgba(47,123,255,.22), transparent 60%),
           radial-gradient(700px 450px at 100% 110%, rgba(0,229,255,.16), transparent 60%),
           var(--bg);
         padding:28px 16px 48px; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none;
         background-image:linear-gradient(rgba(0,229,255,.05) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(0,229,255,.05) 1px, transparent 1px);
         background-size:40px 40px; mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 80%); }
  .wrap { position:relative; max-width:640px; margin:0 auto; }
  header { text-align:center; margin-bottom:26px; }
  .logo { font-size:44px; font-weight:800; letter-spacing:2px; margin:0;
          background:linear-gradient(90deg,var(--neon),var(--neon2),var(--neon)); background-size:200% auto;
          -webkit-background-clip:text; background-clip:text; color:transparent;
          filter:drop-shadow(0 0 12px rgba(0,229,255,.55)); animation:shine 6s linear infinite; }
  @keyframes shine { to { background-position:200% center; } }
  .tag { color:var(--muted); font-size:14px; margin-top:6px; letter-spacing:.5px; }
  .panel { background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line);
           border-radius:18px; padding:22px; margin-bottom:18px;
           box-shadow:0 0 0 1px rgba(0,229,255,.06), 0 0 40px rgba(47,123,255,.12); }
  .create { position:relative; width:100%; padding:20px; font-size:20px; font-weight:700; letter-spacing:1.5px;
            text-transform:uppercase; color:#001018; border:0; border-radius:14px; cursor:pointer;
            background:linear-gradient(90deg,var(--neon),var(--neon2));
            box-shadow:0 0 18px rgba(0,229,255,.6), 0 0 50px rgba(47,123,255,.35);
            transition:transform .08s, box-shadow .2s, filter .2s; }
  .create:hover { box-shadow:0 0 26px rgba(0,229,255,.9), 0 0 70px rgba(47,123,255,.55); }
  .create:active { transform:scale(.98); }
  .create:disabled { filter:grayscale(.6) brightness(.7); cursor:wait; }
  .status { min-height:20px; margin-top:12px; font-size:13px; text-align:center; color:var(--muted); }
  .status.err { color:var(--danger); }
  .field { margin-top:14px; }
  .field label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-bottom:6px; }
  .row { display:flex; gap:8px; align-items:center; background:#050a17; border:1px solid var(--line);
         border-radius:10px; padding:10px 12px; }
  .row code { flex:1; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16px; color:var(--neon);
              text-shadow:0 0 8px rgba(0,229,255,.5); word-break:break-all; }
  .btn { background:transparent; border:1px solid var(--neon2); color:var(--neon); border-radius:8px;
         padding:7px 12px; font-size:12px; cursor:pointer; white-space:nowrap; transition:.15s; }
  .btn:hover { background:rgba(0,229,255,.1); box-shadow:0 0 12px rgba(0,229,255,.4); }
  .btn.done { color:var(--ok); border-color:var(--ok); }
  .btn.danger { color:var(--danger); border-color:rgba(255,77,141,.5); }
  .hidden { display:none !important; }
  h2 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:2px; color:var(--neon);
       display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .live { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok);
          box-shadow:0 0 8px var(--ok); margin-right:8px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .msgs { list-style:none; margin:0; padding:0; }
  .msgs li { padding:12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer;
             background:#060c1b; transition:.15s; }
  .msgs li:hover { border-color:var(--neon); box-shadow:0 0 14px rgba(0,229,255,.25); }
  .msgs .from { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; }
  .msgs .subj { font-weight:600; margin:4px 0 2px; }
  .msgs .intro { font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { text-align:center; color:var(--muted); font-size:14px; padding:18px 0; }
  .viewer iframe { width:100%; height:420px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .viewer pre { white-space:pre-wrap; word-break:break-word; background:#050a17; border:1px solid var(--line);
                border-radius:10px; padding:12px; max-height:420px; overflow:auto; }
  .acc { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 0;
         border-top:1px solid var(--line); font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; }
  .acc span { word-break:break-all; }
  .acc .acts { display:flex; gap:6px; }
  .note { font-size:12px; color:var(--muted); line-height:1.55; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo">NexusMail</h1>
    <div class="tag">Настоящая почта в один клик</div>
  </header>

  <section class="panel">
    <button class="create" id="create">⚡ Создать почту</button>
    <div class="status" id="status"></div>

    <div id="creds" class="hidden">
      <div class="field">
        <label>Почта</label>
        <div class="row"><code id="email"></code><button class="btn" data-copy="email">Копировать</button></div>
      </div>
      <div class="field">
        <label>Пароль</label>
        <div class="row"><code id="pass"></code><button class="btn" data-copy="pass">Копировать</button></div>
      </div>
    </div>
  </section>

  <section class="panel hidden" id="inboxPanel">
    <h2><span><span class="live"></span>Входящие</span><button class="btn" id="refresh">Обновить</button></h2>
    <ul class="msgs" id="msgs"></ul>
    <div class="viewer hidden" id="viewer">
      <h2><span id="vSubj"></span><button class="btn" id="vClose">Назад</button></h2>
      <div id="vBody"></div>
    </div>
  </section>

  <section class="panel hidden" id="accPanel">
    <h2>Мои ящики <button class="btn danger" id="clearAcc">Очистить</button></h2>
    <div id="accList"></div>
  </section>

  <p class="note">Ящики создаются через бесплатный сервис mail.tm — это реальные адреса, которые принимают письма.
    Данные для входа хранятся только в этом браузере.</p>
</div>

<script>
(() => {
  const API = 'https://api.mail.tm';
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- случайные данные ----------
  function rnd(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  function pick(s) { return s[rnd(s.length)]; }
  const LOWER = 'abcdefghijkmnopqrstuvwxyz', UPPER = 'ABCDEFGHJKLMNPQRSTUVWXYZ',
        DIGIT = '23456789', SYM = '!@#$%&*?';

  function randomPassword(len = 10) {
    const all = LOWER + UPPER + DIGIT + SYM;
    const chars = [pick(LOWER), pick(UPPER), pick(DIGIT), pick(SYM)];
    while (chars.length < len) chars.push(pick(all));
    for (let i = chars.length - 1; i > 0; i--) { const j = rnd(i + 1); [chars[i], chars[j]] = [chars[j], chars[i]]; }
    return chars.join('');
  }

  const WORDS = ['nexus','neon','pixel','cyber','nova','orbit','quantum','vector','flux','echo','zen','byte',
                 'storm','shadow','pulse','astro','blaze','frost','lunar','spark','vortex','drift','prism'];
  function randomLogin() {
    let s = pick(WORDS) + pick(WORDS);
    for (let i = 0; i < 4; i++) s += pick('0123456789');
    return s;
  }

  // ---------- API ----------
  async function api(path, { method = 'GET', body, token } = {}) {
    const headers = { 'Accept': 'application/json' };
    if (body) headers['Content-Type'] = 'application/json';
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const r = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 429) throw new Error('Слишком много запросов, подождите пару секунд');
    if (!r.ok) {
      let msg = 'HTTP ' + r.status;
      try { const j = await r.json(); msg = j['hydra:description'] || j.detail || j.message || msg; } catch {}
      const e = new Error(msg); e.status = r.status; throw e;
    }
    return r.status === 204 ? null : r.json();
  }
  const list = j => j['hydra:member'] || j.member || (Array.isArray(j) ? j : []);

  async function createAccount() {
    const domains = list(await api('/domains')).filter(d => d.isActive !== false && !d.isPrivate);
    if (!domains.length) throw new Error('Сервис сейчас не выдаёт домены');
    const domain = domains[rnd(domains.length)].domain;
    for (let attempt = 0; attempt < 5; attempt++) {
      const address = randomLogin() + '@' + domain;
      const password = randomPassword(10);
      try {
        await api('/accounts', { method: 'POST', body: { address, password } });
      } catch (e) {
        if (e.status === 422) continue; // адрес занят — пробуем другой
        throw e;
      }
      const { token } = await api('/token', { method: 'POST', body: { address, password } });
      return { address, password, token, created: Date.now() };
    }
    throw new Error('Не удалось подобрать свободный адрес');
  }

  // ---------- состояние ----------
  let accounts = store.get('nexus.accounts', []);
  let current = null, pollTimer = null;

  function setStatus(text, err) { $('status').textContent = text; $('status').classList.toggle('err', !!err); }

  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
    if (btn) { const o = btn.textContent; btn.textContent = '✓'; btn.classList.add('done');
               setTimeout(() => { btn.textContent = o; btn.classList.remove('done'); }, 1100); }
  }

  function showAccount(acc) {
    current = acc;
    $('email').textContent = acc.address;
    $('pass').textContent = acc.password;
    $('creds').classList.remove('hidden');
    $('inboxPanel').classList.remove('hidden');
    closeViewer();
    $('msgs').innerHTML = '<div class="empty">Загрузка…</div>';
    clearInterval(pollTimer);
    loadInbox();
    pollTimer = setInterval(loadInbox, 10000);
  }

  async function ensureToken(acc) {
    if (acc.token) return acc.token;
    const { token } = await api('/token', { method: 'POST', body: { address: acc.address, password: acc.password } });
    acc.token = token; saveAccounts(); return token;
  }

  async function authed(acc, path) {
    try { return await api(path, { token: await ensureToken(acc) }); }
    catch (e) { if (e.status === 401) { acc.token = null; return api(path, { token: await ensureToken(acc) }); } throw e; }
  }

  async function loadInbox() {
    const acc = current; if (!acc) return;
    try {
      const msgs = list(await authed(acc, '/messages'));
      if (acc !== current) return;
      const ul = $('msgs'); ul.innerHTML = '';
      if (!msgs.length) { ul.innerHTML = '<div class="empty">Писем пока нет — они появятся здесь автоматически</div>'; return; }
      msgs.forEach(m => {
        const li = document.createElement('li');
        const from = document.createElement('div'); from.className = 'from';
        const a = document.createElement('span'); a.textContent = (m.from && (m.from.name || m.from.address)) || '—';
        const t = document.createElement('span'); t.textContent = new Date(m.createdAt).toLocaleString();
        from.append(a, t);
        const s = document.createElement('div'); s.className = 'subj'; s.textContent = m.subject || '(без темы)';
        const i = document.createElement('div'); i.className = 'intro'; i.textContent = m.intro || '';
        li.append(from, s, i);
        li.onclick = () => openMessage(m.id);
        ul.append(li);
      });
    } catch (e) { $('msgs').innerHTML = ''; const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Ошибка: ' + e.message; $('msgs').append(d); }
  }

  async function openMessage(id) {
    $('msgs').classList.add('hidden'); $('viewer').classList.remove('hidden');
    $('vSubj').textContent = 'Загрузка…'; $('vBody').innerHTML = '';
    try {
      const m = await authed(current, '/messages/' + encodeURIComponent(id));
      $('vSubj').textContent = m.subject || '(без темы)';
      const html = Array.isArray(m.html) ? m.html.join('') : m.html;
      if (html) {
        const f = document.createElement('iframe');
        f.setAttribute('sandbox', ''); // без скриптов
        f.srcdoc = html; $('vBody').append(f);
      } else {
        const p = document.createElement('pre'); p.textContent = m.text || ''; $('vBody').append(p);
      }
    } catch (e) { $('vSubj').textContent = 'Ошибка: ' + e.message; }
  }
  function closeViewer() { $('viewer').classList.add('hidden'); $('msgs').classList.remove('hidden'); }

  function saveAccounts() { store.set('nexus.accounts', accounts.map(({ token, ...a }) => a)); }

  function renderAccounts() {
    const box = $('accList'); box.innerHTML = '';
    $('accPanel').classList.toggle('hidden', !accounts.length);
    accounts.forEach(acc => {
      const row = document.createElement('div'); row.className = 'acc';
      const s = document.createElement('span'); s.textContent = acc.address;
      const acts = document.createElement('div'); acts.className = 'acts';
      const open = document.createElement('button'); open.className = 'btn'; open.textContent = 'Открыть';
      open.onclick = () => { showAccount(acc); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      const cp = document.createElement('button'); cp.className = 'btn'; cp.textContent = 'Пароль';
      cp.onclick = () => copyText(acc.password, cp);
      acts.append(open, cp); row.append(s, acts); box.append(row);
    });
  }

  // ---------- кнопки ----------
  $('create').onclick = async () => {
    const b = $('create'); b.disabled = true; setStatus('Создаём ящик…');
    try {
      const acc = await createAccount();
      accounts.unshift(acc); accounts = accounts.slice(0, 30); saveAccounts(); renderAccounts();
      showAccount(acc);
      setStatus('Готово! Почта создана ✓');
    } catch (e) {
      setStatus(e instanceof TypeError ? 'Нет связи с сервером mail.tm' : 'Ошибка: ' + e.message, true);
    } finally { b.disabled = false; }
  };
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyText($(b.dataset.copy).textContent, b));
  $('refresh').onclick = loadInbox;
  $('vClose').onclick = closeViewer;
  $('clearAcc').onclick = () => {
    if (!confirm('Удалить список ящиков из этого браузера?')) return;
    accounts = []; saveAccounts(); renderAccounts();
  };

  renderAccounts();
  if (accounts[0]) showAccount(accounts[0]);
})();
</script>
</body>
</html>
